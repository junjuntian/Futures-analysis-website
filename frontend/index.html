<script>
  // 防闪屏:app 挂载前就把深色类挂上(键与 src/theme.ts 保持一致)。
  // 默认深色——运营者的行情终端全是深色,无偏好时跟随惯用环境。
  try {
    if ((localStorage.getItem('fap-theme') || 'dark') === 'dark') {
      document.documentElement.classList.add('dark')
    }
  } catch (e) { document.documentElement.classList.add('dark') }
</script>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
