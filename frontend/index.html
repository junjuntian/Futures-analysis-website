<!-- charset 必须有:标题是中文,缺它浏览器按系统区域猜 GBK,标签页直接乱码
     (2026-08-16 实测)。此前标题是纯 ASCII 域名,这坑一直没暴露。 -->
<meta charset="utf-8">
<title>期货机构资金</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script>
  // 防闪屏:app 挂载前就把深色类挂上(键与 src/theme.ts 保持一致)。
  // 默认深色——运营者的行情终端全是深色,无偏好时跟随惯用环境。
  try {
    if ((localStorage.getItem('fap-theme') || 'dark') === 'dark') {
      document.documentElement.classList.add('dark')
    }
  } catch (e) { document.documentElement.classList.add('dark') }
</script>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
