server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # 注意 nginx 的 add_header **不继承**：只要某个 location 里出现了自己的
    # add_header，上面那三条安全头在这个 location 上就全部失效。所以下面每个
    # location 都要把它们重写一遍——漏写不会报错，只是安全头静悄悄地没了。

    # 构建产物的文件名带内容 hash，内容变了文件名就变。可以放心长缓存。
    location /assets/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        # index.html 是「当前该加载哪些 chunk」的清单，绝不能被缓存住。
        # 不给 Cache-Control 时浏览器会自己猜一个新鲜期（常见是按 Last-Modified
        # 距今的一成），于是拿着旧清单去加载旧 chunk：页面不报错，只是行为停在
        # 上一版——比报错难发现得多。2026-08-15 实测踩过一次：小窗改动已经上线，
        # 运营者刷新后看到的仍是旧格式，一度以为没改。
        # no-cache 不是不缓存，是每次都带 ETag 回源校验，没变就 304，很便宜。
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
