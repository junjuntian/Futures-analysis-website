name: futures-analysis-platform

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-futures_platform}
      POSTGRES_USER: ${POSTGRES_USER:-futures_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-futures_app_dev_password}
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    build:
      context: .
      dockerfile: rust/Dockerfile.api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-futures-analysis-platform}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: ${DATABASE_URL:-postgres://futures_app:futures_app_dev_password@postgres:5432/futures_platform}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/api", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - backend
      - edge

  worker:
    build:
      context: .
      dockerfile: rust/Dockerfile.worker
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-futures-analysis-platform-worker}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      BIND_ADDR: 0.0.0.0:8081
      DATABASE_URL: ${DATABASE_URL:-postgres://futures_app:futures_app_dev_password@postgres:5432/futures_platform}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  frontend:
    image: node:24.18.0-bookworm-slim
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-lc", "corepack enable && pnpm install --frozen-lockfile && pnpm --dir frontend dev"]
    volumes:
      - ./:/app
      - frontend_node_modules:/app/frontend/node_modules
      - root_node_modules:/app/node_modules
    networks:
      - edge
    profiles:
      - dev

  nginx:
    image: nginx:1.29.4-alpine
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - edge

volumes:
  postgres_data:
  frontend_node_modules:
  root_node_modules:

networks:
  backend:
    internal: true
  edge:
