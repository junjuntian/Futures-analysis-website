name: futures-analysis-platform

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-futures_platform}
      POSTGRES_USER: ${POSTGRES_USER:-futures_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-futures_app_dev_password}
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 并行查询要的共享内存。**Docker 默认只给 /dev/shm 64MB**,而 Postgres 的
    # parallel worker 在那里开段;撑满之后报的是
    # `could not resize shared memory segment ... No space left on device`,
    # 查询直接失败 —— 在页面上表现为 500,而且**只在并发时出现**。
    #
    # 2026-09-14 实测:席位页一次并发四个 pnl-breakdown,四个全 500
    # (延迟 11.8~13.9 秒,不是任何一个超时值 —— 那正是「不是超时、是查询失败」的信号),
    # 重试一次就全 200。当天库里这条错出现 4 次,与那 4 个 500 一一对应。
    #
    # 256m 不是拍脑袋:错误里要的段是 2MB,64MB 在四路并发下会被撑满;
    # 而这台机器**总共只有 1.9GB 内存**,shm 是 tmpfs、计入容器的内存限额,
    # 所以不能像常见建议那样写 1g。256m 是上限不是预留,平时按需占用。
    shm_size: 256m
    # `effective_cache_size` 默认 **4GB** —— 在这台机器上是**假话**:总内存 1.9GB,
    # 这个容器的限额只有 768M。它不分配任何内存,只告诉规划器「缓存有多大」,
    # 而规划器据此判断随机 I/O 会不会命中缓存。报 4GB = 告诉它「整张表都在内存里」,
    # 于是它低估回表的代价,专挑要回表的计划。
    #
    # 2026-09-20 实测现场(DEC-255):席位页那条 `distinct instrument` 被规划成
    # 索引扫 + 回表,读了 **474 MB** 磁盘只为了取 12 行;`seat_history` 3.29 GB,
    # 缓存命中率只有 **63%**。真相是这台机器能给 postgres 的缓存约 640M
    # (768M 限额减去 shm 与连接开销),照实写。
    #
    # **不动 shared_buffers**:它是真分配内存的,128M→192M 会把容器从 510M 推到 ~574M,
    # 而 shm 那 256M 也计入同一个 768M 限额(DEC-249 的教训)。省下的那点缓存
    # 不值得拿容器 OOM 去换 —— 真正治本的是索引,见迁移 202609210001。
    command:
      - postgres
      - -c
      - effective_cache_size=640MB
    networks:
      - backend
    deploy:
      resources:
        limits:
          # 512M 已经用到 370M(72%),再给 shm 留出余量就不够了。
          # 机器 1.9G、可用 1.1G,api 只用 100M,提到 768M 仍有富余。
          memory: 768M

  api:
    build:
      context: .
      dockerfile: rust/Dockerfile.services
      target: api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-futures-analysis-platform}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_ENV: ${APP_ENV:-development}
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-/run/secrets/database-url}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8088}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      BOOTSTRAP_TOKEN_FILE: ${BOOTSTRAP_TOKEN_FILE:-/run/secrets/bootstrap-token}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ${FUTURES_SECRETS_HOST_DIR:-/etc/futures-platform/secrets}:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/api", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - backend
      - edge

  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    profiles:
      - collector
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /work:size=128m,mode=0700,uid=10001,gid=10001
    environment:
      COLLECTOR_CREDENTIALS_FILE: /run/secrets/collector-credentials
      COLLECTOR_TEMP_ROOT: /work
      TMPDIR: /work
      FUTURES_DCE_HISTORY_DIR: /srv/dce-history
    volumes:
      - ${COLLECTOR_CREDENTIALS_FILE:-/etc/futures-platform/secrets/collector-credentials}:/run/secrets/collector-credentials:ro
      # The exchange's own annual history files (DEC-044). Read-only, and only
      # read when --dce-history is passed: normal daily collection never opens
      # this directory.
      - ${DCE_HISTORY_DIR:-/opt/futures-platform/dce-history}:/srv/dce-history:ro
    networks:
      - edge
    mem_limit: 512m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID

  frontend:
    image: node:24.18.0-bookworm-slim
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-lc", "corepack enable && pnpm install --frozen-lockfile && pnpm --dir frontend dev"]
    volumes:
      - ./:/app
      - frontend_node_modules:/app/frontend/node_modules
      - root_node_modules:/app/node_modules
    networks:
      - edge
    profiles:
      - dev

  nginx:
    image: nginx:1.29.4-alpine
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 机构资金信号页(引擎产物,生产固定在 legacy 路径,不随 release 目录轮换;
      # 开发机无此目录时 Docker 建空目录,该页 404,不影响其余服务)
      - /opt/futures-platform/smart-money/web:/usr/share/nginx/smart-money:ro
    depends_on:
      - api
    networks:
      - edge

volumes:
  postgres_data:
  frontend_node_modules:
  root_node_modules:

networks:
  backend:
    internal: true
  edge:
