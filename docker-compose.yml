name: futures-analysis-platform

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-futures_platform}
      POSTGRES_USER: ${POSTGRES_USER:-futures_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-futures_app_dev_password}
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    build:
      context: .
      dockerfile: rust/Dockerfile.api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-futures-analysis-platform}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_ENV: ${APP_ENV:-development}
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-/run/secrets/database-url}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8088}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      BOOTSTRAP_TOKEN_FILE: ${BOOTSTRAP_TOKEN_FILE:-/run/secrets/bootstrap-token}
      OBJECT_STORAGE_ROOT: ${OBJECT_STORAGE_ROOT:-/var/lib/futures-platform/objects}
      IMPORT_MAX_BYTES: ${IMPORT_MAX_BYTES:-52428800}
      IMPORT_SSE_REVALIDATE_SECONDS: ${IMPORT_SSE_REVALIDATE_SECONDS:-15}
      IMPORT_IDEMPOTENCY_PEPPER_FILE: ${IMPORT_IDEMPOTENCY_PEPPER_FILE:-/run/secrets/import-idempotency-pepper}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ${FUTURES_SECRETS_HOST_DIR:-/etc/futures-platform/secrets}:/run/secrets:ro
      - object_storage_data:/var/lib/futures-platform/objects
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/api", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - backend
      - edge

  worker:
    build:
      context: .
      dockerfile: rust/Dockerfile.worker
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-futures-analysis-platform-worker}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      BIND_ADDR: 0.0.0.0:8081
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-/run/secrets/database-url}
      OBJECT_STORAGE_ROOT: ${OBJECT_STORAGE_ROOT:-/var/lib/futures-platform/objects}
      OBJECT_STALE_SECONDS: ${OBJECT_STALE_SECONDS:-3600}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ${FUTURES_SECRETS_HOST_DIR:-/etc/futures-platform/secrets}:/run/secrets:ro
      - object_storage_data:/var/lib/futures-platform/objects
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    profiles:
      - collector
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      COLLECTOR_CREDENTIALS_FILE: /run/secrets/collector-credentials
    volumes:
      - ${COLLECTOR_CREDENTIALS_FILE:-/etc/futures-platform/secrets/collector-credentials}:/run/secrets/collector-credentials:ro
    networks:
      - edge
    mem_limit: 512m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID

  frontend:
    image: node:24.18.0-bookworm-slim
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-lc", "corepack enable && pnpm install --frozen-lockfile && pnpm --dir frontend dev"]
    volumes:
      - ./:/app
      - frontend_node_modules:/app/frontend/node_modules
      - root_node_modules:/app/node_modules
    networks:
      - edge
    profiles:
      - dev

  nginx:
    image: nginx:1.29.4-alpine
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - edge

volumes:
  postgres_data:
  object_storage_data:
  frontend_node_modules:
  root_node_modules:

networks:
  backend:
    internal: true
  edge:
