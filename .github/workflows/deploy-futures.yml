name: Deploy futures

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Exact 40-character Git SHA already validated by CI and GHCR
        required: true
        type: string
      acceptance_sha:
        description: Exact harness SHA; may differ only in the deploy workflow and Phase 4A E2E
        required: true
        type: string
      api_digest:
        description: Immutable API sha256 digest
        required: true
        type: string
      frontend_digest:
        description: Immutable Frontend sha256 digest
        required: true
        type: string
      collector_digest:
        description: Immutable Collector sha256 digest
        required: true
        type: string
      collection_date:
        description: Recent completed trading date for Phase 4A acceptance (YYYY-MM-DD)
        required: true
        type: string
      provision_collector:
        description: Explicitly run the one-time collector credential/account management flow
        required: true
        default: false
        type: boolean
      run_live_collection:
        description: Run the full 3-pass live 5-exchange Phase 4A collection gate. Set false for deploys that do not touch collector/Phase 4A code to skip ~1h of unrelated live collection.
        required: true
        default: true
        type: boolean
      image_sources:
        description: Per-image build-source shas (api=<sha>,frontend=<sha>,...) when the build reused images from an earlier commit. Filled by ops/preflight-deploy.sh; empty means every image was built at git_sha. Each entry is verified byte-identical to git_sha over that image's input paths before anything runs.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: futures-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and accept production candidate
    # 托管 runner。这个作业本来就不在生产机上干活——它把发布包 scp 过去、
    # 再 ssh 执行远程脚本,所以换成托管机器只是换了发起端。
    # 前提(已核实):生产的 SSH 对公网开放,FUTURES_SSH_* 三个 secret 已配好。
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    env:
      REMOTE_RELEASE: /opt/futures-platform-releases/${{ inputs.git_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      FUTURES_SSH_HOST: ${{ secrets.FUTURES_SSH_HOST }}
      FUTURES_SSH_PORT: ${{ secrets.FUTURES_SSH_PORT }}
      FUTURES_SSH_USER: ${{ secrets.FUTURES_SSH_USER }}
    steps:
      - name: Initialize runner paths
        shell: bash
        run: |
          {
            echo "SSH_KEY_FILE=${RUNNER_TEMP}/futures-deploy-key"
            echo "SSH_KNOWN_HOSTS_FILE=${RUNNER_TEMP}/futures-known-hosts"
            echo "RELEASE_BUNDLE=${RUNNER_TEMP}/futures-release"
          } >>"${GITHUB_ENV}"

      - name: Validate immutable release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.git_sha }}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${{ inputs.acceptance_sha }}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${{ inputs.api_digest }}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${{ inputs.frontend_digest }}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${{ inputs.collector_digest }}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${{ inputs.collection_date }}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "${FUTURES_SSH_PORT}" =~ ^[0-9]{1,5}$ ]]
          [[ "${FUTURES_SSH_HOST}" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ "${FUTURES_SSH_USER}" =~ ^[A-Za-z0-9._-]+$ ]]

      - name: Checkout exact acceptance harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.acceptance_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify runtime and acceptance revisions
        shell: bash
        run: |
          set -euo pipefail
          runtime_sha='${{ inputs.git_sha }}'
          acceptance_sha='${{ inputs.acceptance_sha }}'
          test "$acceptance_sha" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$acceptance_sha"
          git cat-file -e "${runtime_sha}^{commit}"
          git merge-base --is-ancestor "$runtime_sha" "$acceptance_sha"
          if test "$runtime_sha" != "$acceptance_sha"; then
            mapfile -t changed_files < <(git diff --name-only "$runtime_sha" "$acceptance_sha")
            test "${#changed_files[@]}" -gt 0
            for changed_file in "${changed_files[@]}"; do
              case "$changed_file" in
                .github/workflows/deploy-futures.yml|rust/tests/phase_4a_e2e.sh|rust/tests/phase_5a_e2e.sh|rust/migrations/202608030003_phase_4a_projection_rollback_delete_grants.sql) ;;
                *)
                  echo "acceptance-only revision changes forbidden file: $changed_file" >&2
                  exit 1
                  ;;
              esac
            done
            printf '%s\n' "${changed_files[@]}" |
              grep -Ex 'rust/tests/phase_(4a|5a)_e2e\.sh' >/dev/null
          fi
          # 复用镜像的等价核验。构建工作流按各镜像的输入路径判定复用；这里用同一组
          # 路径重验一遍：声称复用自 S 的镜像，S 与本次 sha 在这些路径上必须逐字节
          # 一致，否则就是把旧代码当新代码部署。路径集两边必须保持一致。
          image_sources='${{ inputs.image_sources }}'
          if test -n "$image_sources"; then
            declare -A image_paths=(
              [api]='rust/ .github/workflows/container-images.yml'
              [frontend]='frontend/ package.json pnpm-lock.yaml pnpm-workspace.yaml .github/workflows/container-images.yml'
              [collector]='collector/ .github/workflows/container-images.yml'
            )
            IFS=',' read -ra source_pairs <<<"$image_sources"
            for source_pair in "${source_pairs[@]}"; do
              source_image="${source_pair%%=*}"
              source_sha="${source_pair#*=}"
              test -n "${image_paths[$source_image]:-}"
              [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
              git cat-file -e "${source_sha}^{commit}"
              git merge-base --is-ancestor "$source_sha" "$runtime_sha"
              # shellcheck disable=SC2086
              git diff --quiet "$source_sha" "$runtime_sha" -- ${image_paths[$source_image]}
            done
          fi

      - name: Install strict SSH identity
        shell: bash
        env:
          FUTURES_SSH_PRIVATE_KEY: ${{ secrets.FUTURES_SSH_PRIVATE_KEY }}
          FUTURES_SSH_KNOWN_HOSTS: ${{ secrets.FUTURES_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "${FUTURES_SSH_PRIVATE_KEY}" >"${SSH_KEY_FILE}"
          printf '%s\n' "${FUTURES_SSH_KNOWN_HOSTS}" >"${SSH_KNOWN_HOSTS_FILE}"
          chmod 600 "${SSH_KEY_FILE}" "${SSH_KNOWN_HOSTS_FILE}"
          ssh-keygen -y -f "${SSH_KEY_FILE}" >/dev/null
          ssh-keygen -F "${FUTURES_SSH_HOST}" -f "${SSH_KNOWN_HOSTS_FILE}" >/dev/null

      - name: Prepare release bundle and deployment program
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 \
            "${RELEASE_BUNDLE}/deploy/nginx" \
            "${RELEASE_BUNDLE}/deploy/collector" \
            "${RELEASE_BUNDLE}/backfill" \
            "${RELEASE_BUNDLE}/migrations" \
            "${RELEASE_BUNDLE}/e2e"
          install -m 600 docker-compose.yml "${RELEASE_BUNDLE}/docker-compose.yml"
          install -m 600 docker-compose.production.yml "${RELEASE_BUNDLE}/docker-compose.production.yml"
          install -m 600 deploy/nginx/nginx.conf "${RELEASE_BUNDLE}/deploy/nginx/nginx.conf"
          install -m 700 deploy/collector/run-collector.sh \
            "${RELEASE_BUNDLE}/deploy/collector/run-collector.sh"
          install -m 700 deploy/collector/run-spread-warm.sh \
            "${RELEASE_BUNDLE}/deploy/collector/run-spread-warm.sh"
          install -m 600 deploy/collector/sina-dce-daily.py \
            "${RELEASE_BUNDLE}/deploy/collector/sina-dce-daily.py"
          install -m 600 deploy/collector/load-dce-daily.sql \
            "${RELEASE_BUNDLE}/deploy/collector/load-dce-daily.sql"
          install -m 600 deploy/collector/load-seats-direct.sql \
            "${RELEASE_BUNDLE}/deploy/collector/load-seats-direct.sql"
          install -m 600 deploy/collector/load-catalog-direct.sql \
            "${RELEASE_BUNDLE}/deploy/collector/load-catalog-direct.sql"
          install -m 600 deploy/collector/load-calendar-direct.sql \
            "${RELEASE_BUNDLE}/deploy/collector/load-calendar-direct.sql"
          install -m 600 deploy/collector/compute-seat-totals.sql \
            "${RELEASE_BUNDLE}/deploy/collector/compute-seat-totals.sql"
          install -m 600 deploy/collector/compute-spread-monitor.sql \
            "${RELEASE_BUNDLE}/deploy/collector/compute-spread-monitor.sql"
          install -m 600 deploy/collector/infer-offboard-seats.sql \
            "${RELEASE_BUNDLE}/deploy/collector/infer-offboard-seats.sql"
          install -m 600 deploy/collector/fix-sanhe-fabricated-zeros.sql \
            "${RELEASE_BUNDLE}/deploy/collector/fix-sanhe-fabricated-zeros.sql"
          install -m 600 deploy/collector/fix-sanhe-fabricated-changes.sql \
            "${RELEASE_BUNDLE}/deploy/collector/fix-sanhe-fabricated-changes.sql"
          # 采集与解析的 Python 一起发。这几个此前只存在于服务器上的手工副本，与仓库版
          # 各自演化：2026-08-12 查出服务器那份 parsers.py 还在按「品种上市年」补三位
          # 郑商所代码的世纪，把 2026 年的 FG608 解析成 FG1608，跟真实存在过的 2016 年
          # 合约撞进同一条序列，行情与席位各错了 96 行和 2958 行。仓库里那份早就修成
          # 按交易日锚定，改动却从来没走到机器上——同样的病 run-backfill.sh 也犯过。
          # 清单显式列出，理由同迁移清单；漏列由 ops/preflight-deploy.sh 挡。
          install -m 600 backfill/parsers.py "${RELEASE_BUNDLE}/backfill/parsers.py"
          install -m 600 backfill/to_csv.py "${RELEASE_BUNDLE}/backfill/to_csv.py"
          install -m 600 backfill/dce_to_csv.py "${RELEASE_BUNDLE}/backfill/dce_to_csv.py"
          install -m 600 backfill/fetch_exchange.py "${RELEASE_BUNDLE}/backfill/fetch_exchange.py"
          install -m 600 backfill/sanhe_seats.py "${RELEASE_BUNDLE}/backfill/sanhe_seats.py"
          install -m 600 backfill/sanhe_survey.py "${RELEASE_BUNDLE}/backfill/sanhe_survey.py"
          install -m 600 backfill/sanhe_to_csv.py "${RELEASE_BUNDLE}/backfill/sanhe_to_csv.py"
          install -m 600 backfill/sina_dce_gap.py "${RELEASE_BUNDLE}/backfill/sina_dce_gap.py"
          install -m 600 backfill/load_history.py "${RELEASE_BUNDLE}/backfill/load_history.py"
          install -m 600 backfill/sina_coverage.py "${RELEASE_BUNDLE}/backfill/sina_coverage.py"
          install -m 600 backfill/sina_fields.py "${RELEASE_BUNDLE}/backfill/sina_fields.py"
          install -m 600 backfill/sanhe_survey_all.py "${RELEASE_BUNDLE}/backfill/sanhe_survey_all.py"
          install -m 600 backfill/load_sanhe_seats.sql "${RELEASE_BUNDLE}/backfill/load_sanhe_seats.sql"
          install -m 600 deploy/collector/futures-collector.cron \
            "${RELEASE_BUNDLE}/deploy/collector/futures-collector.cron"
          install -m 600 deploy/collector/futures-official-seats.cron \
            "${RELEASE_BUNDLE}/deploy/collector/futures-official-seats.cron"
          install -m 600 deploy/collector/futures-smart-money.cron \
            "${RELEASE_BUNDLE}/deploy/collector/futures-smart-money.cron"
          install -m 600 deploy/collector/futures-collector.logrotate \
            "${RELEASE_BUNDLE}/deploy/collector/futures-collector.logrotate"
          install -m 600 \
            rust/migrations/202607260001_phase_3d_rollback_and_object_governance.sql \
            rust/migrations/202607260002_phase_3d_worker_fairness.sql \
            rust/migrations/202608020001_phase_4a_collection_schema.sql \
            rust/migrations/202608020002_dce_fallback_source.sql \
            rust/migrations/202608030001_phase_4a_evaluator_fixes.sql \
            rust/migrations/202608030002_phase_4a_rls_backfill.sql \
            rust/migrations/202608030003_phase_4a_projection_rollback_delete_grants.sql \
            rust/migrations/202608050001_phase_5a_spread_provider.sql \
            rust/migrations/202608090001_phase_5a_leg_order_mismatch.sql \
            rust/migrations/202608090002_eastmoney_seats_source.sql \
            rust/migrations/202608100001_dce_official_history_source.sql \
            rust/migrations/202608100002_market_prices_daily_range.sql \
            rust/migrations/202608100003_instrument_price_multiplier.sql \
            rust/migrations/202608100004_eastmoney_dce_market_source.sql \
            rust/migrations/202608100005_spread_retention_delete_grants.sql \
            rust/migrations/202608100006_price_multiplier_seed_under_rls.sql \
            rust/migrations/202608100007_market_prices_volume_turnover.sql \
            rust/migrations/202608100008_price_and_seat_history.sql \
            rust/migrations/202608100009_self_spread_provider.sql \
            rust/migrations/202608100010_volume_basis_may_be_unknown.sql \
            rust/migrations/202608100011_product_instrument_scope.sql \
            rust/migrations/202608110001_seat_member_key_index.sql \
            rust/migrations/202608110002_seat_totals_identity.sql \
            rust/migrations/202608120001_spread_monitor_daily.sql \
            rust/migrations/202608130001_seat_history_data_health_index.sql \
            rust/migrations/202608130002_unbind_reference_tables_from_import_channel.sql \
            rust/migrations/202608130003_drop_import_channel.sql \
            "${RELEASE_BUNDLE}/migrations/"
          # The list above is explicit so a release always ships a reviewed set
          # of migrations, and it deliberately omits the pre-Phase-3D baseline
          # that production applied long ago. The hazard is adding a migration
          # and forgetting the list: the code ships while its schema never
          # arrives, which is how a leg-order deploy reached production and
          # answered 500 on every query. Everything at or after the oldest
          # bundled migration must therefore be present.
          oldest_bundled=$(find "${RELEASE_BUNDLE}/migrations" -name '*.sql' -printf '%f\n' | sort | head -n1)
          missing_migrations=$(comm -23 \
            <(find rust/migrations -name '*.sql' -printf '%f\n' | sort | awk -v floor="$oldest_bundled" '$0 >= floor') \
            <(find "${RELEASE_BUNDLE}/migrations" -name '*.sql' -printf '%f\n' | sort))
          if test -n "$missing_migrations"; then
            echo "DEPLOY_FAIL migrations_not_bundled" >&2
            printf '%s\n' "$missing_migrations" >&2
            exit 1
          fi
          # A migration records its own version in schema_versions; the runner
          # skips files whose version is already present. One that forgets the
          # insert reruns on every deploy and never registers, so acceptance
          # sees the schema as missing while the file looks applied.
          for migration_file in "${RELEASE_BUNDLE}"/migrations/*.sql; do
            migration_version=$(basename "$migration_file")
            migration_version=${migration_version%%_*}
            if ! grep -q "insert into schema_versions" "$migration_file" ||
               ! grep -q "'${migration_version}'" "$migration_file"; then
              echo "DEPLOY_FAIL migration_missing_version_record" >&2
              echo "$(basename "$migration_file")" >&2
              exit 1
            fi
          done
          install -d -m 700 "${RELEASE_BUNDLE}/engine"
          install -m 700 engine/run-official-seats.sh "${RELEASE_BUNDLE}/engine/run-official-seats.sh"
          install -m 700 engine/run-smart-money.sh "${RELEASE_BUNDLE}/engine/run-smart-money.sh"
          install -m 600 engine/smart_money.py "${RELEASE_BUNDLE}/engine/smart_money.py"
          install -m 700 rust/tests/phase_4a_e2e.sh "${RELEASE_BUNDLE}/e2e/phase_4a_e2e.sh"
          install -m 700 rust/tests/phase_5a_e2e.sh "${RELEASE_BUNDLE}/e2e/phase_5a_e2e.sh"

          cat >"${RELEASE_BUNDLE}/deploy-futures-remote.sh" <<'REMOTE_SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          SOURCE_SHA=$1
          API_DIGEST=$2
          FRONTEND_DIGEST=$3
          COLLECTOR_DIGEST=$4
          GHCR_USER=$5
          RUN_URL=$6
          RELEASE_DIR=$7
          COLLECTION_DATE=$8
          PROVISION_COLLECTOR=$9
          ACCEPTANCE_SHA=${10}
          RUN_LIVE_COLLECTION=${11}
          IMAGE_SOURCES=${12}
          # 和日更管线抢同一把锁。
          #
          # 2026-08-12 连挂两次：迁移里的 `alter table ... owner to futures_migrator`
          # 要 AccessExclusiveLock，撞上正在写 seat_history 的作业就死锁，部署整轮回滚。
          # 第二次撞的是 13:30 UTC 的 run-collector.sh 本身——**而回滚反过来把采集的
          # 连接杀了**（日志里 `terminating connection due to administrator command`），
          # 那一轮数据也没了。两个方向都会坏事，之前没出问题只是恰好错开了 cron。
          #
          # run-collector.sh 早就在用这把锁（它自己是 `flock -n`，抢不到就当天不跑）。
          # 部署这边用 -w：等一段时间而不是立刻放弃，日更整轮通常几分钟。等不到就退出，
          # 让人换个窗口重发——总好过跑到一半死锁再回滚。
          COLLECTOR_LOCK=/run/lock/futures-collector.lock
          exec 8>"$COLLECTOR_LOCK"
          if ! flock -w 900 8; then
            echo "DEPLOY_ABORTED 等了 15 分钟仍拿不到日更锁，换个窗口重发" >&2
            exit 1
          fi

          LEGACY_ROOT=/opt/futures-platform
          RELEASES_ROOT=/opt/futures-platform-releases
          BACKUP_ROOT=/opt/futures-platform-backups
          STATE_ROOT=/var/lib/futures-platform/deployments
          EVIDENCE_ROOT=/var/lib/futures-platform/deployment-evidence
          API_IMAGE=ghcr.io/junjuntian/futures-analysis-website-api
          FRONTEND_IMAGE=ghcr.io/junjuntian/futures-analysis-website-frontend
          COLLECTOR_IMAGE=ghcr.io/junjuntian/futures-analysis-website-collector
          API_REF="${API_IMAGE}@${API_DIGEST}"
          FRONTEND_REF="${FRONTEND_IMAGE}@${FRONTEND_DIGEST}"
          COLLECTOR_REF="${COLLECTOR_IMAGE}@${COLLECTOR_DIGEST}"
          export IMAGE_TAG="sha-${SOURCE_SHA}"
          SUCCESS=0
          SWITCH_STARTED=0
          MIGRATION_STARTED=0
          REGISTRY_CLEANED=0
          BACKUP_PATH=
          HOST_INSTALL_STARTED=0
          HOST_BACKUP_TAR=
          CREDENTIAL_CREATED=0
          PREVIOUS_STABLE=
          PREVIOUS_RUNTIME=
          EVIDENCE_DIR=

          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ACCEPTANCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$COLLECTION_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$PROVISION_COLLECTOR" = true || "$PROVISION_COLLECTOR" = false ]]
          [[ "$RUN_LIVE_COLLECTION" = true || "$RUN_LIVE_COLLECTION" = false ]]
          # 各镜像实际构建自的提交。默认 = 本次 sha；构建复用了旧镜像时由
          # image_sources 覆盖。runner 侧已核验每个来源与本次 sha 在该镜像的
          # 输入路径上逐字节一致，这里只负责「镜像确实是那个来源建出来的」。
          API_SOURCE_SHA="$SOURCE_SHA"
          FRONTEND_SOURCE_SHA="$SOURCE_SHA"
          COLLECTOR_SOURCE_SHA="$SOURCE_SHA"
          if [ -n "$IMAGE_SOURCES" ]; then
            IFS=',' read -ra image_source_pairs <<<"$IMAGE_SOURCES"
            for image_source_pair in "${image_source_pairs[@]}"; do
              case "${image_source_pair%%=*}" in
                api) API_SOURCE_SHA="${image_source_pair#*=}" ;;
                frontend) FRONTEND_SOURCE_SHA="${image_source_pair#*=}" ;;
                collector) COLLECTOR_SOURCE_SHA="${image_source_pair#*=}" ;;
                *) echo "DEPLOY_FAIL unknown_image_source" >&2; exit 1 ;;
              esac
            done
          fi
          for image_source_sha in "$API_SOURCE_SHA" "$FRONTEND_SOURCE_SHA" "$COLLECTOR_SOURCE_SHA"; do
            [[ "$image_source_sha" =~ ^[0-9a-f]{40}$ ]]
          done
          for digest in "$API_DIGEST" "$FRONTEND_DIGEST" "$COLLECTOR_DIGEST"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
          [[ "$GHCR_USER" =~ ^[A-Za-z0-9-]+$ ]]
          [[ "$RUN_URL" =~ ^https://github.com/junjuntian/Futures-analysis-website/actions/runs/[0-9]+$ ]]
          case "$RELEASE_DIR" in
            "$RELEASES_ROOT"/*) ;;
            *) echo "DEPLOY_FAIL unsafe_release_dir" >&2; exit 1 ;;
          esac

          IFS= read -r GHCR_TOKEN || test -n "${GHCR_TOKEN:-}"
          test -n "${GHCR_TOKEN:-}" || {
            echo "DEPLOY_FAIL empty_github_token" >&2
            exit 1
          }

          install -d -m 700 "$BACKUP_ROOT" "$STATE_ROOT" "$EVIDENCE_ROOT"
          cd "$RELEASE_DIR"
          sha256sum -c SHA256SUMS >/dev/null

          DOCKER_CONFIG=$(mktemp -d /tmp/futures-ghcr.XXXXXX)
          chmod 700 "$DOCKER_CONFIG"
          DEFAULT_GHCR_AUTH_BEFORE=absent
          if test -f /root/.docker/config.json &&
             jq -e '.auths["ghcr.io"] // empty' /root/.docker/config.json >/dev/null 2>&1; then
            DEFAULT_GHCR_AUTH_BEFORE=present
          fi
          cleanup_registry() {
            if test "$REGISTRY_CLEANED" -eq 0; then
              docker --config "$DOCKER_CONFIG" logout ghcr.io >/dev/null 2>&1 || true
              case "$DOCKER_CONFIG" in
                /tmp/futures-ghcr.*) rm -rf -- "$DOCKER_CONFIG" ;;
                *) echo "DEPLOY_FAIL unsafe_docker_config_path" >&2 ;;
              esac
              unset GHCR_TOKEN
              REGISTRY_CLEANED=1
            fi
          }

          registry_http_probe() {
            local image=$1 digest=$2 repository auth_status manifest_status bearer
            repository=${image#ghcr.io/}
            printf 'user = "%s:%s"\n' "$GHCR_USER" "$GHCR_TOKEN" \
              >"$DOCKER_CONFIG/curl-auth.conf"
            chmod 600 "$DOCKER_CONFIG/curl-auth.conf"
            auth_status=$(curl -sS --config "$DOCKER_CONFIG/curl-auth.conf" \
              -o "$DOCKER_CONFIG/token.json" -w '%{http_code}' \
              "https://ghcr.io/token?scope=repository:${repository}:pull" || true)
            manifest_status=not_requested
            if test "$auth_status" = 200; then
              bearer=$(jq -r '.token // .access_token // empty' "$DOCKER_CONFIG/token.json")
              if test -n "$bearer"; then
                printf 'header = "Authorization: Bearer %s"\n' "$bearer" \
                  >"$DOCKER_CONFIG/curl-bearer.conf"
                chmod 600 "$DOCKER_CONFIG/curl-bearer.conf"
                manifest_status=$(curl -sS --config "$DOCKER_CONFIG/curl-bearer.conf" \
                  -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
                  -o /dev/null -w '%{http_code}' \
                  "https://ghcr.io/v2/${repository}/manifests/${digest}" || true)
                unset bearer
              fi
            fi
            echo "GHCR_ACCESS_DIAGNOSTIC image=${image} token_http=${auth_status} manifest_http=${manifest_status}" >&2
          }

          pull_exact() {
            local image=$1 digest=$2
            if ! docker --config "$DOCKER_CONFIG" pull "${image}@${digest}" \
              >"$DOCKER_CONFIG/pull.stdout" 2>"$DOCKER_CONFIG/pull.stderr"; then
              registry_http_probe "$image" "$digest"
              echo "DEPLOY_FAIL ghcr_pull_failed image=${image}" >&2
              return 1
            fi
            test "$(docker image inspect --format '{{.Architecture}}' "${image}@${digest}")" = amd64
          }

          rollback_deployment() {
            local rollback_status=0
            set +e
            echo "ROLLBACK_STARTED"
            if test -f "$RELEASE_DIR/docker-compose.release.yml"; then
              docker compose \
                -f "$RELEASE_DIR/docker-compose.yml" \
                -f "$RELEASE_DIR/docker-compose.production.yml" \
                -f "$RELEASE_DIR/docker-compose.release.yml" \
                ps >"$RELEASE_DIR/failure-compose-ps.txt" 2>&1
              docker compose \
                -f "$RELEASE_DIR/docker-compose.yml" \
                -f "$RELEASE_DIR/docker-compose.production.yml" \
                -f "$RELEASE_DIR/docker-compose.release.yml" \
                logs --no-color --tail 200 api \
                >"$RELEASE_DIR/failure-service-logs.txt" 2>&1
              chmod 600 "$RELEASE_DIR/failure-compose-ps.txt" \
                "$RELEASE_DIR/failure-service-logs.txt"
            fi
            if test -n "$BACKUP_PATH" && test -f "$BACKUP_PATH"; then
              docker compose \
                -f "$RELEASE_DIR/docker-compose.yml" \
                -f "$RELEASE_DIR/docker-compose.production.yml" \
                -f "$RELEASE_DIR/docker-compose.release.yml" \
                stop api frontend nginx >/dev/null 2>&1
              docker compose -f "$RELEASE_DIR/docker-compose.yml" \
                exec -T postgres psql -X -U futures_app -d futures_platform \
                -Atq -c "select pg_terminate_backend(pid) from pg_stat_activity where datname='futures_platform' and pid <> pg_backend_pid()" \
                >/dev/null 2>&1
              db_restore_failed=0
              docker compose -f "$RELEASE_DIR/docker-compose.yml" \
                exec -T postgres dropdb -U futures_app --if-exists futures_platform \
                >/dev/null 2>&1 || db_restore_failed=1
              docker compose -f "$RELEASE_DIR/docker-compose.yml" \
                exec -T postgres createdb -U futures_app -O futures_app futures_platform \
                >/dev/null 2>&1 || db_restore_failed=1
              if ! docker compose -f "$RELEASE_DIR/docker-compose.yml" \
                exec -T postgres pg_restore -U futures_app -d futures_platform \
                --no-owner --exit-on-error --single-transaction \
                <"$BACKUP_PATH" >/dev/null; then
                db_restore_failed=1
              fi
              # 数据库没恢复好就**不要再启动业务服务**。原来这里只把状态累计成 1
              # 继续往下走，旧 binary 对着半迁移/半恢复的 schema 跑起来，比停机
              # 更难收拾。保持服务停止，转人工恢复。
              if test "$db_restore_failed" -eq 1; then
                echo "ROLLBACK_DB_RESTORE_FAILED services_left_stopped manual_recovery_required backup=$BACKUP_PATH" >&2
                set -e
                return 1
              fi
              docker compose -f "$RELEASE_DIR/docker-compose.yml" \
                exec -T postgres psql -X -U futures_app -d futures_platform \
                -v ON_ERROR_STOP=1 -q <<'ROLLBACK_SQL' >/dev/null || rollback_status=1
          alter database futures_platform owner to futures_app;
          alter schema public owner to futures_app;
          alter schema app owner to futures_app;
          alter role futures_migrator nologin;
          ROLLBACK_SQL
            fi

            # 宿主机 wrapper/cron/引擎恢复到安装前的快照。E2E 失败时这些文件已经
            # 是候选版，只回数据库不回它们，下一个 cron 就拿新脚本跑旧 schema。
            if test "$HOST_INSTALL_STARTED" -eq 1 && test -n "$HOST_BACKUP_TAR" &&
               test -f "$HOST_BACKUP_TAR"; then
              tar -C / -xpf "$HOST_BACKUP_TAR" || rollback_status=1
            fi
            # 本轮新造的采集凭据一并撤掉：恢复后的库里没有这个账号（备份在建号
            # 前拍），文件留下就是「文件在、账号无」的永久中间态。
            if test "$CREDENTIAL_CREATED" -eq 1; then
              rm -f /etc/futures-platform/secrets/collector-credentials
              echo "ROLLBACK_REMOVED_ORPHAN_CREDENTIAL"
            fi
            if test -n "$PREVIOUS_STABLE" && test -f "$PREVIOUS_STABLE"; then
              # stable 指针也要回。它在验收后、报告前就被写成候选；之后任何失败
              # 只回滚服务不回指针的话，collector/spread wrapper source 到的还是
              # 没通过验收的 release。
              cp "$PREVIOUS_STABLE" "$STATE_ROOT/stable.env" || rollback_status=1
              chmod 600 "$STATE_ROOT/stable.env" 2>/dev/null || true
              # shellcheck disable=SC1090
              . "$PREVIOUS_STABLE"
              if ! docker compose \
                -f "$previous_release_dir/docker-compose.yml" \
                -f "$previous_release_dir/docker-compose.production.yml" \
                -f "$previous_release_dir/docker-compose.release.yml" \
                up -d --no-build --remove-orphans >/dev/null; then
                rollback_status=1
              fi
              # up -d 返回 0 不等于活了：API 可能起来即崩，原来这里照样打
              # ROLLBACK_PASS。就绪探测通过才算回滚成功。
              if ! timeout 180 bash -c \
                'until curl -fsS http://127.0.0.1:8088/api/v1/health/ready >/dev/null 2>&1; do sleep 3; done'; then
                echo "ROLLBACK_SERVICES_NOT_READY" >&2
                rollback_status=1
              fi
            else
              if ! docker compose -f "$LEGACY_ROOT/docker-compose.yml" \
                --profile dev up -d --no-build --remove-orphans >/dev/null; then
                rollback_status=1
              fi
              if test -f "$PREVIOUS_RUNTIME"; then
                # shellcheck disable=SC1090
                . "$PREVIOUS_RUNTIME"
                for spec in "api:$previous_api_id" "frontend:$previous_frontend_id"; do
                  service=${spec%%:*}
                  expected=${spec#*:}
                  cid=$(docker compose -f "$LEGACY_ROOT/docker-compose.yml" \
                    --profile dev ps -q "$service" | head -n1)
                  test -n "$cid" &&
                    test "$(docker inspect --format '{{.Image}}' "$cid")" = "$expected" ||
                    rollback_status=1
                done
              fi
            fi
            if test "$rollback_status" -eq 0; then
              echo "ROLLBACK_PASS"
            else
              echo "ROLLBACK_FAIL" >&2
            fi
            set -e
            return "$rollback_status"
          }

          emit_phase4a_failure_diagnostics() {
            local log
            test -n "$EVIDENCE_DIR" || return 0
            for log in "$EVIDENCE_DIR"/phase4a-work/*.log; do
              test -f "$log" || continue
              grep -Eh \
                '^(INFO|WARNING|ERROR) (collector_start_failed|exchange_failed|dataset_collected|dataset_failed|dataset_submit_failed|fallback_activated|fallback_failed|batch_failed|batch_succeeded) ' \
                "$log" || true
            done
          }

          on_exit() {
            local status=$?
            trap - EXIT
            if test "$status" -ne 0 && test "$SWITCH_STARTED" -eq 1; then
              emit_phase4a_failure_diagnostics
              rollback_deployment || status=1
            fi
            cleanup_registry
            exit "$status"
          }
          trap on_exit EXIT
          if test "$DEFAULT_GHCR_AUTH_BEFORE" = present; then
            echo "DEPLOY_FAIL persistent_ghcr_auth_preexists" >&2
            exit 1
          fi

          if ! printf '%s' "$GHCR_TOKEN" |
            docker --config "$DOCKER_CONFIG" login ghcr.io \
              --username "$GHCR_USER" --password-stdin >/dev/null 2>&1; then
            registry_http_probe "$API_IMAGE" "$API_DIGEST"
            echo "DEPLOY_FAIL ghcr_login_failed" >&2
            exit 1
          fi

          pull_exact "$API_IMAGE" "$API_DIGEST"
          pull_exact "$FRONTEND_IMAGE" "$FRONTEND_DIGEST"
          pull_exact "$COLLECTOR_IMAGE" "$COLLECTOR_DIGEST"
          for spec in "$API_REF=$API_SOURCE_SHA" "$FRONTEND_REF=$FRONTEND_SOURCE_SHA" "$COLLECTOR_REF=$COLLECTOR_SOURCE_SHA"; do
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${spec%%=*}")" = "${spec#*=}"
          done

          PREVIOUS_RUNTIME="$STATE_ROOT/previous-runtime-${SOURCE_SHA}-${GITHUB_RUN_ID:-manual}.env"
          {
            for service in api frontend; do
              cid=$(docker compose -f "$LEGACY_ROOT/docker-compose.yml" --profile dev ps -q "$service" | head -n1)
              test -n "$cid"
              image_id=$(docker inspect --format '{{.Image}}' "$cid")
              printf 'previous_%s_id=%q\n' "$service" "$image_id"
            done
          } >"$PREVIOUS_RUNTIME"
          chmod 600 "$PREVIOUS_RUNTIME"

          if test -f "$STATE_ROOT/stable.env"; then
            PREVIOUS_STABLE="$STATE_ROOT/previous-stable-${SOURCE_SHA}.env"
            cp "$STATE_ROOT/stable.env" "$PREVIOUS_STABLE"
            chmod 600 "$PREVIOUS_STABLE"
            # shellcheck disable=SC1090
            . "$PREVIOUS_STABLE"
            for ref in "$previous_api_ref" "$previous_frontend_ref"; do
              docker image inspect "$ref" >/dev/null
            done
            if test -n "${previous_collector_ref:-}"; then
              docker image inspect "$previous_collector_ref" >/dev/null
            fi
          fi
          cleanup_registry

          cat >"$RELEASE_DIR/docker-compose.release.yml" <<EOF
          services:
            api:
              image: ${API_REF}
              environment:
                APP_ENV: acceptance
            collector:
              image: ${COLLECTOR_REF}
            frontend:
              image: ${FRONTEND_REF}
          EOF
          chmod 600 "$RELEASE_DIR/docker-compose.release.yml"
          # Carry the deployed public origin into the release compose. The
          # value is host-specific (this VPS is reached by IP, not localhost)
          # and lives in the legacy .env next to the other operational
          # settings. Without this, every deploy fell back to the localhost
          # default and browser logins were rejected by the Origin check.
          if legacy_origin=$(grep -m1 '^PUBLIC_ORIGIN=' "$LEGACY_ROOT/.env" 2>/dev/null); then
            legacy_origin=${legacy_origin#PUBLIC_ORIGIN=}
            legacy_origin=${legacy_origin%\"}
            legacy_origin=${legacy_origin#\"}
            if [[ "$legacy_origin" =~ ^https?://[A-Za-z0-9._-]+(:[0-9]{1,5})?$ ]]; then
              export PUBLIC_ORIGIN="$legacy_origin"
            else
              echo "DEPLOY_FAIL invalid_public_origin" >&2
              exit 1
            fi
          fi
          COMPOSE=(
            docker compose
            -f "$RELEASE_DIR/docker-compose.yml"
            -f "$RELEASE_DIR/docker-compose.production.yml"
            -f "$RELEASE_DIR/docker-compose.release.yml"
          )
          "${COMPOSE[@]}" config --quiet
          "${COMPOSE[@]}" config >"$RELEASE_DIR/rendered-compose.yml"
          if grep -Eq '^[[:space:]]+build:|:latest([[:space:]]|$)' "$RELEASE_DIR/rendered-compose.yml"; then
            echo "DEPLOY_FAIL mutable_or_build_compose" >&2
            exit 1
          fi

          ensure_legacy_secret() {
            local target=$1 key=$2 line value tmp
            if test -s "$target"; then
              chown root:root "$target"
              chmod 400 "$target"
              return
            fi
            line=$(grep -m1 "^${key}=" "$LEGACY_ROOT/.env")
            value=${line#*=}
            case "$value" in
              \"*\") value=${value#\"}; value=${value%\"} ;;
              \'*\') value=${value#\'}; value=${value%\'} ;;
            esac
            test -n "$value"
            tmp=$(mktemp /etc/futures-platform/secrets/.migrate.XXXXXX)
            printf '%s' "$value" >"$tmp"
            chown root:root "$tmp"
            chmod 400 "$tmp"
            mv "$tmp" "$target"
            unset line value
          }
          ensure_legacy_secret /etc/futures-platform/secrets/postgres-password POSTGRES_PASSWORD
          for required in database-url import-idempotency-pepper master-key-v1 postgres-password; do
            test -s "/etc/futures-platform/secrets/$required"
            test "$(stat -c %a "/etc/futures-platform/secrets/$required")" = 400
          done

          COLLECTOR_CREDENTIAL_FILE=/etc/futures-platform/secrets/collector-credentials
          if test "$PROVISION_COLLECTOR" = true && test ! -s "$COLLECTOR_CREDENTIAL_FILE"; then
            public_origin=$("${COMPOSE[@]}" config --format json |
              jq -r '.services.api.environment.PUBLIC_ORIGIN')
            [[ "$public_origin" =~ ^https?://[A-Za-z0-9._:-]+$ ]]
            collector_password=$(openssl rand -base64 48 | tr -d '\n' | tr '+/' '-_')
            credential_tmp=$(mktemp /etc/futures-platform/secrets/.collector.XXXXXX)
            printf '{"base_url":"http://api:8080","origin":"%s","username":"collector-service","password":"%s"}' \
              "$public_origin" "$collector_password" >"$credential_tmp"
            chown root:root "$credential_tmp"
            chmod 400 "$credential_tmp"
            mv "$credential_tmp" "$COLLECTOR_CREDENTIAL_FILE"
            unset collector_password
            # 本轮新造的凭据。数据库账号要到 provision 那步才建，备份也在建号
            # 前拍——中途任何失败回滚后，库里没有这个账号，文件却永久留下，
            # 下一轮 provision=false 只查文件非空就放行，日更从此登录失败。
            # 回滚时按此标志把文件删掉，让下一轮重新走 provision。
            CREDENTIAL_CREATED=1
          fi
          test -s "$COLLECTOR_CREDENTIAL_FILE"
          test "$(stat -c %U:%G "$COLLECTOR_CREDENTIAL_FILE")" = root:root
          test "$(stat -c %a "$COLLECTOR_CREDENTIAL_FILE")" = 400

          timestamp=$(date -u +%Y%m%dT%H%M%SZ)
          BACKUP_PATH="$BACKUP_ROOT/database-before-${SOURCE_SHA}-${timestamp}.dump"
          backup_tmp="${BACKUP_PATH}.tmp"
          docker compose -f "$LEGACY_ROOT/docker-compose.yml" exec -T postgres \
            pg_dump -U futures_app -d futures_platform -Fc >"$backup_tmp"
          chmod 600 "$backup_tmp"
          docker compose -f "$LEGACY_ROOT/docker-compose.yml" exec -T postgres \
            pg_restore --list <"$backup_tmp" >/dev/null
          mv "$backup_tmp" "$BACKUP_PATH"
          BACKUP_SHA256=$(sha256sum "$BACKUP_PATH" | awk '{print $1}')
          SWITCH_STARTED=1
          MIGRATION_STARTED=1

          docker compose -f "$LEGACY_ROOT/docker-compose.yml" exec -T postgres \
            psql -X -U futures_app -d futures_platform -v ON_ERROR_STOP=1 -q \
            <<'OWNER_SQL' >/dev/null
          alter role futures_migrator login nosuperuser nocreatedb nocreaterole
            noinherit noreplication nobypassrls;
          alter database futures_platform owner to futures_migrator;
          alter schema public owner to futures_migrator;
          alter schema app owner to futures_migrator;
          do $$
          declare item record;
          begin
            for item in
              select n.nspname, c.relname, c.relkind
                from pg_class c join pg_namespace n on n.oid=c.relnamespace
               where n.nspname in ('public','app')
                 and c.relkind in ('r','p','v','m','f')
            loop
              execute format('alter table %I.%I owner to futures_migrator',
                item.nspname, item.relname);
            end loop;
            for item in
              select n.nspname, c.relname
                from pg_class c join pg_namespace n on n.oid=c.relnamespace
               where n.nspname in ('public','app')
                 and c.relkind = 'S'
            loop
              execute format('alter sequence %I.%I owner to futures_migrator',
                item.nspname, item.relname);
            end loop;
            for item in
              select n.nspname, p.proname,
                     pg_get_function_identity_arguments(p.oid) args,
                     p.prokind
                from pg_proc p join pg_namespace n on n.oid=p.pronamespace
               where n.nspname in ('public','app')
            loop
              if item.prokind = 'p' then
                execute format('alter procedure %I.%I(%s) owner to futures_migrator',
                  item.nspname, item.proname, item.args);
              else
                execute format('alter function %I.%I(%s) owner to futures_migrator',
                  item.nspname, item.proname, item.args);
              end if;
            end loop;
          end $$;
          OWNER_SQL

          # Apply whatever the release actually bundles, in filename order. A
          # second hardcoded list here would silently skip a migration that the
          # bundle carries -- which is exactly how the leg-order schema never
          # reached production while every file looked present.
          for migration_path in "$RELEASE_DIR"/migrations/*.sql; do
            migration=$(basename "$migration_path")
            version=${migration%%_*}
            applied=$(docker compose -f "$LEGACY_ROOT/docker-compose.yml" exec -T postgres \
              psql -X -U futures_migrator -d futures_platform -Atq \
              -c "select count(*) from schema_versions where version='${version}'")
            if test "$applied" = 0; then
              docker compose -f "$LEGACY_ROOT/docker-compose.yml" exec -T postgres \
                psql -X -U futures_migrator -d futures_platform -v ON_ERROR_STOP=1 \
                <"$RELEASE_DIR/migrations/$migration" >/dev/null
            fi
          done
          # Verify every bundled version registered, derived from the bundle so
          # a new migration cannot be left out of this check either.
          bundled_versions=$(find "$RELEASE_DIR/migrations" -name '*.sql' -printf '%f\n' |
            sed "s/_.*//" | sort -u)
          bundled_count=$(printf '%s\n' "$bundled_versions" | grep -c .)
          bundled_list=$(printf '%s\n' "$bundled_versions" | sed "s/^/'/;s/$/'/" | paste -sd, -)
          test "$(docker compose -f "$LEGACY_ROOT/docker-compose.yml" exec -T postgres \
            psql -X -U futures_app -d futures_platform -Atq \
            -c "select count(*) from schema_versions where version in (${bundled_list})")" = "$bundled_count"

          if test "$PROVISION_COLLECTOR" = true; then
            "${COMPOSE[@]}" run --rm --no-deps api \
              /app/api --provision-collector-account >/dev/null
          fi

          # 迁移窗口结束，立刻收回 migrator 的登录能力。原来只有回滚路径 NOLOGIN，
          # 成功部署后 futures_migrator 一直保持 LOGIN——而它是库、schema 和全部
          # 表的 owner，本地 socket 又是 trust 认证，等于任何能碰到 socket 的进程
          # 都能以 owner 身份 ALTER/DROP。owner 角色常态就该是 NOLOGIN，
          # 下一轮部署自己会再打开。
          docker compose -f "$LEGACY_ROOT/docker-compose.yml" exec -T postgres \
            psql -X -U futures_app -d futures_platform -Atq \
            -c 'alter role futures_migrator nologin' >/dev/null
          test "$(docker compose -f "$LEGACY_ROOT/docker-compose.yml" exec -T postgres \
            psql -X -U futures_app -d futures_platform -Atq \
            -c "select rolcanlogin from pg_roles where rolname='futures_migrator'")" = f

          "${COMPOSE[@]}" up -d --no-build --remove-orphans
          timeout 240 bash -c "until curl -fsS http://127.0.0.1:8088/api/v1/health/ready >/dev/null; do sleep 3; done"
          VERSION_JSON=$(mktemp)
          VERSION_VERIFIED=0
          for version_attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8088/api/v1/version >"$VERSION_JSON" &&
               jq -e --arg sha "$API_SOURCE_SHA" \
                 '.data.git_sha == $sha and .data.git_sha != "local"' \
                 "$VERSION_JSON" >/dev/null; then
              VERSION_VERIFIED=1
              break
            fi
            sleep 3
          done
          rm -f "$VERSION_JSON"
          test "$VERSION_VERIFIED" -eq 1
          echo "DEPLOY_STAGE version_verified"

          for spec in "api:$API_REF" "frontend:$FRONTEND_REF"; do
            service=${spec%%:*}
            ref=${spec#*:}
            expected=$(docker image inspect --format '{{.Id}}' "$ref")
            cid=$("${COMPOSE[@]}" ps -q "$service" | head -n1)
            test -n "$cid"
            test "$(docker inspect --format '{{.Image}}' "$cid")" = "$expected"
          done
          docker image inspect "$COLLECTOR_REF" >/dev/null
          echo "DEPLOY_STAGE runtime_images_verified"

          # 覆盖宿主机文件之前先整体快照。E2E 在这些覆盖**之后**才跑，失败回滚
          # 原来只还原数据库和容器——宿主机上留着候选版 wrapper/cron 对着旧
          # schema 跑，下一个 cron 就是半新半旧的组合。快照进 release 目录，
          # 回滚时整包解回去。
          HOST_BACKUP_TAR="$RELEASE_DIR/host-rollback.tar"
          host_paths=(
            usr/local/sbin/run-futures-collector
            usr/local/sbin/run-futures-backfill
            usr/local/sbin/run-futures-spread-warm
            usr/local/sbin/run-official-seats
            usr/local/sbin/run-smart-money
            etc/cron.d/futures-collector
            etc/logrotate.d/futures-collector
            opt/futures-platform/smart-money/smart_money.py
          )
          for script in "$RELEASE_DIR"/backfill/*; do
            host_paths+=("opt/futures-platform/$(basename "$script")")
          done
          host_existing=()
          for host_path in "${host_paths[@]}"; do
            test -e "/$host_path" && host_existing+=("$host_path")
          done
          if test "${#host_existing[@]}" -gt 0; then
            tar -C / -cpf "$HOST_BACKUP_TAR" "${host_existing[@]}"
            chmod 600 "$HOST_BACKUP_TAR"
          fi
          HOST_INSTALL_STARTED=1

          install -m 700 "$RELEASE_DIR/deploy/collector/run-collector.sh" \
            /usr/local/sbin/run-futures-collector
          install -m 700 "$RELEASE_DIR/deploy/collector/run-spread-warm.sh" \
            /usr/local/sbin/run-futures-spread-warm
          # 解析脚本装到采集的工作目录。**有差异先备份再覆盖**：这里是单向同步，仓库
          # 是唯一来源；但直接丢掉机器上那一版，会让「谁在机器上改过什么」无从追查，
          # 备份留在 .superseded/ 下，出事能立刻拿来对比。
          install -d -m 700 /opt/futures-platform/.superseded
          superseded_dir="/opt/futures-platform/.superseded/${SOURCE_SHA}-${timestamp}"
          for script in "$RELEASE_DIR"/backfill/*.py; do
            name=$(basename "$script")
            live="/opt/futures-platform/$name"
            if [ -f "$live" ] && ! cmp -s "$script" "$live"; then
              install -d -m 700 "$superseded_dir"
              cp -a "$live" "$superseded_dir/$name"
              echo "BACKFILL_SCRIPT_SUPERSEDED $name"
            fi
            install -m 644 "$script" "$live"
          done
          install -m 600 "$RELEASE_DIR/deploy/collector/futures-collector.cron" \
            /etc/cron.d/futures-collector
          # 这两套此前只存在于服务器上、靠手工安装。2026-08-13 迁新机时才发现
          # 「换机器要记得重装」没有任何东西保证——引擎那套一旦漏装,ΔNet 全为 0
          # 而页面照常显示,不会报错。随发布包下发之后,新机器起来就是全的。
          install -m 600 "$RELEASE_DIR/deploy/collector/futures-official-seats.cron" \
            /etc/cron.d/futures-official-seats
          install -m 600 "$RELEASE_DIR/deploy/collector/futures-smart-money.cron" \
            /etc/cron.d/futures-smart-money
          install -m 600 "$RELEASE_DIR/deploy/collector/futures-collector.logrotate" \
            /etc/logrotate.d/futures-collector
          # engine 从此随发布链走。它此前完全不在发布单元里：仓库改了 wrapper 或
          # 引擎，CI/preflight/deploy 全绿，生产 cron 继续跑手工旧副本——与当年
          # parsers.py 漂移同一种病。smart_money.py 有差异先备份再覆盖，口径同
          # backfill；静态页 index.html 仍由运营者手工管理，不在此列。
          install -m 700 "$RELEASE_DIR/engine/run-official-seats.sh" \
            /usr/local/sbin/run-official-seats
          install -m 700 "$RELEASE_DIR/engine/run-smart-money.sh" \
            /usr/local/sbin/run-smart-money
          if test -d /opt/futures-platform/smart-money; then
            engine_live=/opt/futures-platform/smart-money/smart_money.py
            if test -f "$engine_live" &&
               ! cmp -s "$RELEASE_DIR/engine/smart_money.py" "$engine_live"; then
              install -d -m 700 "$superseded_dir"
              cp -a "$engine_live" "$superseded_dir/smart_money.py"
              echo "ENGINE_SUPERSEDED smart_money.py"
            fi
            install -m 644 "$RELEASE_DIR/engine/smart_money.py" "$engine_live"
          fi
          echo "DEPLOY_STAGE collector_schedule_installed"

          EVIDENCE_DIR="$EVIDENCE_ROOT/${SOURCE_SHA}-${timestamp}"
          install -d -m 700 "$EVIDENCE_DIR"
          set -o pipefail
          echo "DEPLOY_STAGE phase4a_e2e_started"
          PHASE4A_RELEASE_DIR="$RELEASE_DIR" \
          PHASE4A_COLLECTION_DATE="$COLLECTION_DATE" \
          PHASE4A_RUN_LIVE_COLLECTION="$RUN_LIVE_COLLECTION" \
          PHASE4A_ORIGIN="${PUBLIC_ORIGIN:-http://localhost:8088}" \
          PHASE4A_EVIDENCE_DIR="$EVIDENCE_DIR/phase4a-work" \
            bash "$RELEASE_DIR/e2e/phase_4a_e2e.sh" |
            tee "$EVIDENCE_DIR/phase4a-stdout.txt"
          test "${PIPESTATUS[0]}" -eq 0
          grep -qx PHASE4A_E2E_PASS "$EVIDENCE_DIR/phase4a-stdout.txt"

          echo "DEPLOY_STAGE phase5a_e2e_started"
          PHASE5A_RELEASE_DIR="$RELEASE_DIR" \
          PHASE5A_ORIGIN="${PUBLIC_ORIGIN:-http://localhost:8088}" \
          PHASE5A_EVIDENCE_DIR="$EVIDENCE_DIR/phase5a-work" \
            bash "$RELEASE_DIR/e2e/phase_5a_e2e.sh" |
            tee "$EVIDENCE_DIR/phase5a-stdout.txt"
          test "${PIPESTATUS[0]}" -eq 0
          grep -qx PHASE5A_E2E_PASS "$EVIDENCE_DIR/phase5a-stdout.txt"

          "${COMPOSE[@]}" logs --no-color --since 4h >"$EVIDENCE_DIR/service-logs.txt"
          if grep -Eiq \
            'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|authorization:[[:space:]]*bearer|BEGIN (OPENSSH|RSA|EC|DSA) PRIVATE KEY' \
            "$EVIDENCE_DIR/service-logs.txt"; then
            echo "DEPLOY_FAIL credential_pattern_in_service_logs" >&2
            exit 1
          fi
          if test -f /root/.docker/config.json &&
             jq -e '.auths["ghcr.io"] // empty' /root/.docker/config.json >/dev/null 2>&1; then
            echo "DEPLOY_FAIL persistent_ghcr_auth_after_deploy" >&2
            exit 1
          fi
          test -z "$(find /tmp -maxdepth 1 -type d -name 'futures-ghcr.*' -print -quit)"

          # Retire legacy plaintext copies only after the candidate has passed.
          if test -f "$LEGACY_ROOT/.env"; then
            sanitized=$(mktemp "$LEGACY_ROOT/.env.sanitized.XXXXXX")
            awk '!/^(POSTGRES_PASSWORD|DATABASE_URL|BOOTSTRAP_TOKEN)=/' \
              "$LEGACY_ROOT/.env" >"$sanitized"
            chmod 600 "$sanitized"
            mv "$sanitized" "$LEGACY_ROOT/.env"
          fi

          DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          REPORT="$EVIDENCE_DIR/deployment-report.txt"
          {
            echo "status=PASS"
            echo "run_url=$RUN_URL"
            echo "git_sha=$SOURCE_SHA"
            echo "acceptance_sha=$ACCEPTANCE_SHA"
            echo "run_live_collection=$RUN_LIVE_COLLECTION"
            echo "public_origin=${PUBLIC_ORIGIN:-default}"
            echo "deployed_at=$DEPLOYED_AT"
            echo "backup_path=$BACKUP_PATH"
            echo "backup_sha256=$BACKUP_SHA256"
            echo "api_ref=$API_REF"
            echo "frontend_ref=$FRONTEND_REF"
            echo "collector_ref=$COLLECTOR_REF"
            echo "migrations=$(printf '%s' "$bundled_versions" | paste -sd, -)"
            echo "phase3c_e2e=NOT_RERUN_PRESERVE_LEGACY_PRODUCTION_DATA"
            echo "phase3d_e2e=NOT_RERUN_PRESERVE_LEGACY_PRODUCTION_DATA"
            echo "phase4a_e2e=PASS"
            echo "phase5a_e2e=PASS"
            echo "collection_date=$COLLECTION_DATE"
            echo "version_git_sha=$SOURCE_SHA"
            echo "runtime_digest_match=PASS"
            echo "collector_image_verified=PASS"
            echo "collector_management_flow=$PROVISION_COLLECTOR"
            echo "registry_auth_cleanup=PASS"
            echo "service_log_secret_scan=PASS"
            echo "evidence_dir=$EVIDENCE_DIR"
          } >"$REPORT"
          cp "$REPORT" "$STATE_ROOT/latest-deployment-report.txt"
          chmod 600 "$STATE_ROOT/latest-deployment-report.txt"

          # stable 指针放到**最后**、用临时文件原子提交。它是 collector/spread
          # wrapper 的运行时真源：写早了，后面报告/校验任何一步失败，回滚把服务
          # 回旧，指针却还指着候选——下一个 cron 就把没通过验收的 release 又拉
          # 起来。写到这里，它后面没有任何会失败的步骤。
          if test -f "$STATE_ROOT/stable.env"; then
            cp "$STATE_ROOT/stable.env" "$STATE_ROOT/stable.previous.env"
          fi
          stable_tmp=$(mktemp "$STATE_ROOT/.stable.XXXXXX")
          {
            printf 'previous_git_sha=%q\n' "$SOURCE_SHA"
            printf 'previous_api_ref=%q\n' "$API_REF"
            printf 'previous_frontend_ref=%q\n' "$FRONTEND_REF"
            printf 'previous_collector_ref=%q\n' "$COLLECTOR_REF"
            printf 'previous_release_dir=%q\n' "$RELEASE_DIR"
            printf 'previous_backup_path=%q\n' "$BACKUP_PATH"
            printf 'previous_deployed_at=%q\n' "$DEPLOYED_AT"
          } >"$stable_tmp"
          chmod 600 "$stable_tmp"
          mv "$stable_tmp" "$STATE_ROOT/stable.env"
          # 保留策略。**放在 stable 提交之后**：这里已经没有会失败的步骤，而且
          # 要保留哪两轮是由刚写好的 stable.env / stable.previous.env 定义的。
          #
          # 为什么需要它：每轮部署拍一个全库快照、拉四个镜像，从来没有人删。
          # 2026-08-13 查生产磁盘：119 个备份 13GB、318 个镜像 7.8GB，55GB 里
          # 有 21GB 是这么堆出来的。清理本身不难，难的是没人会想起来做。
          #
          # 留两轮不留一轮：回滚要用本轮拍的备份，而 stable.previous.env 记着
          # 上一轮的路径——只留一份会让那条记录指向不存在的文件。
          #
          # 失败一律不阻断部署（|| true）：磁盘没清干净是运维问题，把一次已经
          # 验收通过的发布判失败并回滚，是拿真问题换假问题。
          {
            retain=$(mktemp)
            for state in "$STATE_ROOT/stable.env" "$STATE_ROOT/stable.previous.env"; do
              test -f "$state" || continue
              (
                # shellcheck disable=SC1090
                . "$state"
                printf '%s\n' "${previous_backup_path:-}"
              ) >>"$retain"
            done
            grep -v '^$' "$retain" | sort -u >"${retain}.f" && mv "${retain}.f" "$retain"
            if test -s "$retain"; then
              find "$BACKUP_ROOT" -maxdepth 1 -name 'database-before-*.dump' -type f |
                grep -vxFf "$retain" |
                xargs -r rm -f
            fi
            rm -f "$retain"

            # 镜像：只留这两轮引用到的，加上没有仓库名的基础镜像（postgres/nginx）。
            # 按 image id 比对而不是标签——这些镜像是按 digest 拉的，本来就没有标签。
            keep_images=$(mktemp)
            for state in "$STATE_ROOT/stable.env" "$STATE_ROOT/stable.previous.env"; do
              test -f "$state" || continue
              (
                # shellcheck disable=SC1090
                . "$state"
                for ref in "${previous_api_ref:-}" "${previous_frontend_ref:-}" \
                           "${previous_collector_ref:-}"; do
                  test -n "$ref" || continue
                  docker image inspect --format '{{.Id}}' "$ref" 2>/dev/null || true
                done
              ) >>"$keep_images"
            done
            docker images --no-trunc --format '{{.ID}} {{.Repository}}' |
              awk '$2 !~ /futures-analysis-website/ {print $1}' >>"$keep_images"
            sort -u "$keep_images" -o "$keep_images"
            if test -s "$keep_images"; then
              docker images --no-trunc --format '{{.ID}}' | sort -u |
                grep -vxFf "$keep_images" |
                xargs -r docker rmi >/dev/null 2>&1 || true
            fi
            rm -f "$keep_images"
            echo "RETENTION_APPLIED backups=$(find "$BACKUP_ROOT" -maxdepth 1 -name '*.dump' | wc -l) images=$(docker images -q | sort -u | wc -l) disk=$(df -h / | awk 'NR==2 {print $5}')"
          } || true

          SUCCESS=1
          echo "DEPLOYMENT_PASS"
          cat "$REPORT"
          REMOTE_SCRIPT
          chmod 700 "${RELEASE_BUNDLE}/deploy-futures-remote.sh"
          (
            cd "${RELEASE_BUNDLE}"
            find . -type f ! -name SHA256SUMS -print0 |
              sort -z |
              xargs -0 sha256sum >SHA256SUMS
          )

      - name: Transfer release artifacts
        shell: bash
        run: |
          set -euo pipefail
          SSH_TARGET="${FUTURES_SSH_USER}@${FUTURES_SSH_HOST}"
          SSH_OPTIONS=(
            -i "${SSH_KEY_FILE}"
            -p "${FUTURES_SSH_PORT}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${SSH_KNOWN_HOSTS_FILE}"
          )
          SCP_OPTIONS=(
            -i "${SSH_KEY_FILE}"
            -P "${FUTURES_SSH_PORT}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${SSH_KNOWN_HOSTS_FILE}"
          )
          ssh "${SSH_OPTIONS[@]}" "${SSH_TARGET}" \
            "install -d -m 700 '${REMOTE_RELEASE}'"
          scp "${SCP_OPTIONS[@]}" -r "${RELEASE_BUNDLE}/." \
            "${SSH_TARGET}:${REMOTE_RELEASE}/"

      - name: Deploy, migrate, and run VPS acceptance
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SSH_TARGET="${FUTURES_SSH_USER}@${FUTURES_SSH_HOST}"
          SSH_OPTIONS=(
            -i "${SSH_KEY_FILE}"
            -p "${FUTURES_SSH_PORT}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${SSH_KNOWN_HOSTS_FILE}"
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=6
            -o TCPKeepAlive=yes
          )
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf '%s' "${GHCR_TOKEN}" |
            ssh "${SSH_OPTIONS[@]}" "${SSH_TARGET}" \
              "GITHUB_RUN_ID='${GITHUB_RUN_ID}' bash '${REMOTE_RELEASE}/deploy-futures-remote.sh' '${{ inputs.git_sha }}' '${{ inputs.api_digest }}' '${{ inputs.frontend_digest }}' '${{ inputs.collector_digest }}' '${GITHUB_ACTOR}' '${RUN_URL}' '${REMOTE_RELEASE}' '${{ inputs.collection_date }}' '${{ inputs.provision_collector }}' '${{ inputs.acceptance_sha }}' '${{ inputs.run_live_collection }}' '${{ inputs.image_sources }}'"
          unset GHCR_TOKEN

      - name: Verify temporary registry authentication was removed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SSH_TARGET="${FUTURES_SSH_USER}@${FUTURES_SSH_HOST}"
          SSH_OPTIONS=(
            -i "${SSH_KEY_FILE}"
            -p "${FUTURES_SSH_PORT}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${SSH_KNOWN_HOSTS_FILE}"
          )
          ssh "${SSH_OPTIONS[@]}" "${SSH_TARGET}" \
            "test -z \"\$(find /tmp -maxdepth 1 -type d -name 'futures-ghcr.*' -print -quit)\" && { test ! -f /root/.docker/config.json || ! jq -e '.auths[\"ghcr.io\"] // empty' /root/.docker/config.json >/dev/null 2>&1; }"

      - name: Record deployment evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          SSH_TARGET="${FUTURES_SSH_USER}@${FUTURES_SSH_HOST}"
          SSH_OPTIONS=(
            -i "${SSH_KEY_FILE}"
            -p "${FUTURES_SSH_PORT}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${SSH_KNOWN_HOSTS_FILE}"
          )
          SCP_OPTIONS=(
            -i "${SSH_KEY_FILE}"
            -P "${FUTURES_SSH_PORT}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${SSH_KNOWN_HOSTS_FILE}"
          )
          scp "${SCP_OPTIONS[@]}" \
            "${SSH_TARGET}:/var/lib/futures-platform/deployments/latest-deployment-report.txt" \
            "${RUNNER_TEMP}/deployment-report.txt"
          {
            echo '### futures production deployment'
            echo
            echo "- acceptance_sha=${{ inputs.acceptance_sha }}"
            sed 's/^/- /' "${RUNNER_TEMP}/deployment-report.txt"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Remove runner SSH material
        if: always()
        shell: bash
        run: |
          rm -f -- "${SSH_KEY_FILE}" "${SSH_KNOWN_HOSTS_FILE}"
