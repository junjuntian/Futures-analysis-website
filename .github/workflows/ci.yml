name: CI

on:
  # **不接 pull_request。**
  #
  # 这个仓库 2026-08-13 转为公开,而 CI 跑在自建 runner 上,那台 runner 就是
  # 生产服务器本身(runner 用户在 docker 组里,等同 root)。公开仓库一旦接受
  # pull_request 触发,任何人 fork 之后提一个 PR,PR 里的 workflow 就会在生产
  # 服务器上执行他写的任意代码——能读数据库、读 /etc/futures-platform/secrets、
  # 读部署用的 SSH 私钥。GitHub 官方对此的建议是「self-hosted runner 只用于
  # 私有仓库」。
  #
  # 运营者是唯一贡献者,走的是直接推分支,没有 PR 流程,所以去掉它零损失。
  # 将来若真要接外部 PR:要么把这些作业迁到 GitHub 托管 runner(公开仓库免费
  # 且不限分钟数),要么加 head.repo.full_name == github.repository 的判断把
  # fork 挡在外面——但别忘了 runner 上还有生产数据这件事。
  push:
    branches:
      - main
      - phase/**

permissions:
  contents: read

jobs:
  validate:
    # GitHub 托管 runner。公开仓库不限分钟数,而且每次是全新机器——
    # 自建 runner 那些慢性病(匿名卷堆积、磁盘与生产共享、fork PR 能碰到生产)
    # 一次性消失。缓存不受影响:Rust 走 Swatinem/rust-cache、镜像走 type=gha,
    # 两者都存在 GitHub 那边,与 runner 在哪无关。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: phase4a-ci-postgres-20260805
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --memory 384m
          --memory-swap 384m
    env:
      CARGO_INCREMENTAL: 0
      DATABASE_URL: postgres://postgres:phase4a-ci-postgres-20260805@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: rust -> target

      - name: Shellcheck deploy and ops scripts
        # 这些脚本没有测试，出错都是静默的（2026-08-12 就靠人肉在生产日志里
        # 抓到过好几处）。shellcheck 是它们唯一的门禁。
        # ubuntu-latest 镜像预装 shellcheck，不必自己装。
        # -S warning：info 级噪音多（大量风格建议），warning 起步才值得挡构建。
        run: shellcheck -S warning deploy/collector/*.sh ops/*.sh rust/tests/phase_*_e2e.sh

      - name: Rust format
        working-directory: rust
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        working-directory: rust
        run: cargo test --workspace

      - name: PostgreSQL rollback dependency integration test
        working-directory: rust
        run: >-
          cargo test -p database
          imports::tests::postgres_exchange_calendar_dependency_blocks_precheck
          -- --ignored --exact

      - name: PostgreSQL Phase 5A provider integration test
        working-directory: rust
        run: >-
          cargo test -p database
          spread_analytics::tests::postgres_phase_5a_migration_cache_and_throttle_contract
          -- --ignored --exact

      - name: Collector lint and tests
        shell: bash
        run: |
          docker run --rm \
            --cpus 2 \
            --memory 768m \
            --memory-swap 768m \
            --env PIP_DISABLE_PIP_VERSION_CHECK=1 \
            --env PIP_NO_CACHE_DIR=1 \
            --env PIP_ROOT_USER_ACTION=ignore \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env RUFF_CACHE_DIR=/tmp/ruff-cache \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            python:3.13.11-slim-bookworm \
            sh -ec '
              python -m pip install --requirement collector/requirements-dev.lock
              python -m ruff check collector/src collector/tests
              python -m ruff format --check collector/src collector/tests
              cd collector
              python -m pytest -p no:cacheprovider
            '

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        run: pnpm lint

      - name: Frontend tests
        run: pnpm test

      - name: Frontend build
        run: pnpm build

      - name: Docker Compose config
        env:
          IMAGE_TAG: sha-ci-placeholder
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet
