name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - phase/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, futures-vps]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --memory 384m
          --memory-swap 384m
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
      NODE_OPTIONS: --max-old-space-size=768
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: rust -> target

      - name: Rust format
        working-directory: rust
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        working-directory: rust
        run: cargo test --workspace

      - name: PostgreSQL rollback dependency integration test
        working-directory: rust
        run: >-
          cargo test -p database
          imports::tests::postgres_exchange_calendar_dependency_blocks_precheck
          -- --ignored --exact

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.11
          cache: pip
          cache-dependency-path: |
            collector/requirements.lock
            collector/requirements-dev.lock

      - name: Install collector dependencies
        run: python -m pip install --requirement collector/requirements-dev.lock

      - name: Collector lint and format
        run: |
          python -m ruff check collector/src collector/tests
          python -m ruff format --check collector/src collector/tests

      - name: Collector tests
        working-directory: collector
        run: python -m pytest

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        run: pnpm lint

      - name: Frontend tests
        run: pnpm test

      - name: Frontend build
        run: pnpm build

      - name: Docker Compose config
        env:
          IMAGE_TAG: sha-ci-placeholder
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet

  dockerfiles:
    name: Build ${{ matrix.image }} image
    runs-on: [self-hosted, futures-vps]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - image: api
            dockerfile: rust/Dockerfile.api
          - image: worker
            dockerfile: rust/Dockerfile.worker
          - image: frontend
            dockerfile: frontend/Dockerfile
          - image: collector
            dockerfile: collector/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          driver-opts: |
            memory=2g
            memory-swap=2g

      - name: Build image without publishing
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=ci-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.image }}
