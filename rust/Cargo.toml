[workspace]
resolver = "2"
members = [
    "apps/api",
    "apps/worker",
    "crates/application",
    "crates/common",
    "crates/database",
    "crates/domain",
    "crates/infrastructure",
]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
rust-version = "1.96"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
application = { path = "crates/application" }
axum = "0.8"
common = { path = "crates/common" }
database = { path = "crates/database" }
domain = { path = "crates/domain" }
infrastructure = { path = "crates/infrastructure" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "uuid", "time"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros", "serde", "serde-well-known"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "time", "net"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
utoipa = { version = "5.4", features = ["axum_extras", "time", "uuid"] }
uuid = { version = "1.18", features = ["v7", "serde"] }
